name: Feature request
description: Suggest a focused JOBAS improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem should JOBAS solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Feed / sources
        - Profile / memory
        - Applications
        - AI Coach
        - MCP
        - UI / UX
        - Infrastructure
