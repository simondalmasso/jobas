name: Bug report
description: Report a reproducible JOBAS problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve JOBAS. Never paste API keys, CVs or private account data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: Chrome 154 / Windows 10
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console output
      description: Remove personal information and secrets first.
