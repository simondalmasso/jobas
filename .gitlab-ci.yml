stages:
  - mirror

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

mirror_github_to_gitlab:
  stage: mirror
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
    GIT_TERMINAL_PROMPT: "0"
  before_script:
    - apk add --no-cache git
  script:
    - set -eu
    - rm -rf upstream.git
    - git init --bare upstream.git
    - cd upstream.git
    - git remote add github https://github.com/simondalmasso/jobas.git
    - git fetch github '+refs/heads/main:refs/heads/main' '+refs/tags/*:refs/tags/*'
    - git remote add gitlab "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push gitlab refs/heads/main:refs/heads/main
    - git push gitlab --tags
    - GH_SHA="$(git rev-parse refs/heads/main)"
    - GL_SHA="$(git ls-remote gitlab refs/heads/main | awk '{print $1}')"
    - test -n "$GH_SHA"
    - test "$GH_SHA" = "$GL_SHA"
    - echo "GitLab mirrors GitHub main at $GH_SHA"
